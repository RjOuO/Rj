<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.4.8-test</title>

<style>
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  padding:30px
}

/* ===== TEST MODE 視覺防呆 ===== */
body::before{
  content:"TEST MODE";
  position:fixed;
  top:10px;
  right:10px;
  background:#c00;
  color:#fff;
  padding:6px 12px;
  font-weight:bold;
  z-index:9999;
  border-radius:6px;
}
/* ============================= */

/* 整體縮放 70%（沿用 v1.4.7） */
.scale-wrapper{
  transform:scale(0.7);
  transform-origin:top left;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,auto);
  gap:24px;
}

table{border-collapse:collapse;background:#fff}

/* 表格內所有字體 */
td,th{
  border:2px solid #000;
  padding:6px;
  text-align:center;
  font-size:18px;
}

input,
select{
  border:none;
  background:transparent;
  font-size:18px;
}

/* 角色ID、隊長ID 文字輸入置中 */
input:not([type="checkbox"]){
  text-align:center;
}

.reset-btn{
  padding:8px 20px;
  border-radius:999px;
  border:none;
  background:#444;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}

.dropdown{width:100%;border-radius:999px;padding:4px 20px;border:none}
select{text-align-last:center}

.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}

.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#f6c1c1;color:#000}
.status-done{background:#000;color:#fff}

.role-full td{background:#f6c1c1;color:#000}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}

input[type="checkbox"]{transform:scale(1.2)}

.time-input{
  text-align:center;
  letter-spacing:1px;
}

.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}
</style>
</head>

<body>

<div class="scale-wrapper">
  <div class="grid" id="grid"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===== Firebase TEST 專案 ===== */
firebase.initializeApp({
  apiKey:"AIzaSyBoU4Jd1lzrncVc9MV2Y0tHpcJDSW96lgE",
  authDomain:"rjgame-test.firebaseapp.com",
  databaseURL:"https://rjgame-test-default-rtdb.firebaseio.com",
  projectId:"rjgame-test"
});

/* 防呆：測試頁誤連正式就中止 */
if (!firebase.app().options.projectId.includes("test")) {
  alert("⚠️ 測試頁連到了正式 Firebase，已中止");
  throw new Error("Firebase Project mismatch");
}
</script>

<script>
const weekdays=["日","一","二","三","四","五","六"];
const grid=document.getElementById("grid");
const groupNames=["第一團","第二團","第三團","第四團","第五團","第六團","第七團","第八團","第九團"];

function generateMonthDayOptions() {
  let options = '<option value=""></option>';
  const currentYear = new Date().getFullYear();
  for (let month = 1; month <= 12; month++) {
    const lastDay = new Date(currentYear, month, 0).getDate();
    for (let day = 1; day <= lastDay; day++) {
      const value = `${month}/${day}`;
      options += `<option value="${value}">${value}</option>`;
    }
  }
  return options;
}

for(let t=1;t<=9;t++){
  const wrap=document.createElement("div");
  wrap.innerHTML=`<table> ... </table>`;
  grid.appendChild(wrap);
  initTable(wrap,t);
}

function initTable(root,index){
  const ref=firebase.database().ref("test/tables/gameinn-main-"+index);
  let isRemote=false;

  const inputs=root.querySelectorAll("input,select");
  const rows=root.querySelectorAll(".role-row");
  const monthDaySelect = root.querySelector(".month-day-select");
  const time=root.querySelector(".time-input");
  const weekday=root.querySelector(".gray-cell");
  const instance=root.querySelector("select");
  const status=root.querySelectorAll("select")[2];
  const reset=root.querySelector(".reset-btn");

  time.addEventListener("input",()=>{
    let v=time.value.replace(/[^\d]/g,"");
    if(v.length>=3) v=v.slice(0,2)+":"+v.slice(2,4);
    time.value=v.slice(0,5);
  });

  time.addEventListener("blur",()=>{
    if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(time.value)){
      time.value="";
    }
  });

  function updateWeekday(){
    if(!monthDaySelect.value){weekday.textContent="";return;}
    const [month, day] = monthDaySelect.value.split("/").map(Number);
    const currentYear = new Date().getFullYear();
    const d=new Date(currentYear, month - 1, day);
    weekday.textContent="星期"+weekdays[d.getDay()];
  }

  function applyRules(){
    instance.className="dropdown instance-"+(instance.value||"empty");
    status.className="dropdown status-"+(status.value||"open");

    rows.forEach((r,i)=>{
      r.classList.remove("trial-locked","role-full","role-done");
      r.querySelectorAll("input,select").forEach(el=>el.disabled=false);

      if(instance.value==="trial"&&i>=5){
        r.classList.add("trial-locked");
        r.querySelectorAll("input,select").forEach(el=>{
          el.type==="checkbox"?el.checked=false:el.value="";
          el.disabled=true;
        });
      }

      if(status.value!=="open"){
        r.classList.add(status.value==="full"?"role-full":"role-done");
        r.querySelectorAll("td:nth-child(-n+3) input,select").forEach(el=>el.disabled=true);
      }
    });
  }

  function collect(){
    return [...inputs].map(el=>el.type==="checkbox"?el.checked:el.value);
  }

  function push(){
    if(isRemote)return;
    ref.set({data:collect(),updatedAt:Date.now()});
  }

  inputs.forEach(el=>{
    el.addEventListener("input",()=>{updateWeekday();applyRules();push();});
    el.addEventListener("change",()=>{updateWeekday();applyRules();push();});
  });

  reset.onclick=()=>{
    if(!confirm("確定要清除目前團隊內容嗎？"))return;
    inputs.forEach(el=>{
      el.type==="checkbox"?el.checked=false:el.value="";
      el.disabled=false;
    });
    status.value="open";
    applyRules();
    updateWeekday();
    push();
  };

  ref.on("value",snap=>{
    if(!snap.val())return;
    isRemote=true;
    snap.val().data.forEach((v,i)=>{
      const el=inputs[i];
      if(!el)return;
      el.type==="checkbox"?el.checked=v:el.value=v;
    });
    applyRules();
    updateWeekday();
    isRemote=false;
  });

  applyRules();
}
</script>

</body>
</html>
