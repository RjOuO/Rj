<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.4.12-test</title>

<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f5f5f5;padding:30px}
body::before{content:"TEST MODE";position:fixed;top:10px;right:10px;background:#c00;color:#fff;padding:6px 12px;font-weight:bold;z-index:9999;border-radius:6px}

/* 縮放 */
.scale-wrapper{transform:scale(0.7);transform-origin:top left}

/* 直排 */
.grid{display:flex;flex-direction:column;gap:32px}

/* 懸浮團導覽 */
.floating-nav{
  position:fixed;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:9999
}
.floating-nav button{
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:#555;
  color:#fff;
  font-size:18px;
  cursor:pointer
}
.floating-nav button:hover{background:#000}

/* 回頂 */
.back-top{
  position:fixed;
  right:24px;
  bottom:24px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#000;
  color:#fff;
  border:none;
  font-size:22px;
  cursor:pointer;
  z-index:9999
}

/* 表格 */
table{border-collapse:collapse;background:#fff;table-layout:fixed}
td,th{border:2px solid #000;padding:10px;text-align:center;font-size:22px}
input,select{border:none;background:transparent;font-size:22px;text-align:center}
input[type="checkbox"]{transform:scale(1.4)}
.reset-btn{padding:10px 24px;border-radius:999px;border:none;background:#444;color:#fff;cursor:pointer;font-size:22px}
.reset-btn:disabled{opacity:.4;cursor:not-allowed}
.lock-btn{padding:10px 24px;border-radius:999px;border:none;background:#000;color:#fff;cursor:pointer;font-size:22px}
.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:8px 24px}
</style>
</head>

<body>

<!-- 懸浮導覽 -->
<div class="floating-nav" id="floatingNav"></div>
<button class="back-top" onclick="scrollToGroup(1)">↑</button>

<div class="scale-wrapper">
  <div class="grid" id="grid"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoU4Jd1lzrncVc9MV2Y0tHpcJDSW96lgE",
  authDomain:"rjgame-test.firebaseapp.com",
  databaseURL:"https://rjgame-test-default-rtdb.firebaseio.com",
  projectId:"rjgame-test"
});
const db=firebase.database();
</script>

<script>
const weekdays=["日","一","二","三","四","五","六"];
const groupNames=["第一團","第二團","第三團","第四團","第五團","第六團","第七團","第八團","第九團"];
const grid=document.getElementById("grid");

/* ===== 懸浮導覽按鈕 ===== */
function scrollToGroup(n){
  document.getElementById("group-"+n)?.scrollIntoView({behavior:"smooth"});
}
const floatingNav=document.getElementById("floatingNav");
for(let i=1;i<=9;i++){
  const btn=document.createElement("button");
  btn.textContent=i;
  btn.onclick=()=>scrollToGroup(i);
  floatingNav.appendChild(btn);
}

/* ===== 時間選項 ===== */
function generateTimeOptions(){
  let html='<option></option>';
  for(let h=0;h<24;h++){
    const hh=String(h).padStart(2,"0");
    html+=`<option>${hh}:00</option><option>${hh}:30</option>`;
  }
  return html;
}

/* ===== 建立 9 團 ===== */
for(let t=1;t<=9;t++){
  const wrap=document.createElement("div");
  wrap.id="group-"+t;

  wrap.innerHTML=`
  <table>
    <tr>
      <td colspan="4">
        <button class="lock-btn">🔓 解鎖中</button>
        &nbsp;&nbsp;
        <button class="reset-btn">一鍵清除（${groupNames[t-1]}）</button>
      </td>
    </tr>

    <tr>
      <td class="title">報團時間</td>
      <td><input type="date" data-k="date"></td>
      <td class="gray-cell weekday"></td>
      <td><select class="dropdown" data-k="time">${generateTimeOptions()}</select></td>
    </tr>

    <tr>
      <td class="header">副本</td>
      <td class="header">等級</td>
      <td class="header">隊長ID</td>
      <td class="header">狀態</td>
    </tr>

    <tr>
      <td><select class="dropdown" data-k="instance"><option></option><option>一般</option><option>試劍</option></select></td>
      <td><select class="dropdown" data-k="level"><option></option><option>56</option><option>61</option></select></td>
      <td><input data-k="leader"></td>
      <td><select class="dropdown" data-k="status"><option>未滿</option><option>滿團</option><option>完成</option></select></td>
    </tr>

    <tr>
      <td class="header">角色</td><td class="header">定位</td><td class="header">DC</td><td class="header">備註</td>
    </tr>

    ${Array.from({length:10}).map((_,i)=>`
    <tr>
      <td><input data-r="${i}" data-f="name"></td>
      <td><select class="dropdown" data-r="${i}" data-f="role"><option></option><option>坦</option><option>補</option><option>輸出</option></select></td>
      <td><input type="checkbox" data-r="${i}" data-f="dc"></td>
      <td><input data-r="${i}" data-f="note"></td>
    </tr>`).join("")}
  </table>`;
  grid.appendChild(wrap);
  bindGroup(wrap,t);
}

/* ===== Firebase 綁定（完整同步 + 鎖定） ===== */
function bindGroup(root,idx){
  const base=db.ref("test/groups/"+idx);
  const lockRef=base.child("meta/locked");

  const lockBtn=root.querySelector(".lock-btn");
  const resetBtn=root.querySelector(".reset-btn");
  const inputs=[...root.querySelectorAll("input,select")];

  lockBtn.onclick=()=>{
    const wantLock=lockBtn.textContent.includes("解鎖");
    lockRef.set(wantLock);
  };

  lockRef.on("value",s=>{
    const locked=!!s.val();
    lockBtn.textContent=locked?"🔒 已鎖定":"🔓 解鎖中";
    inputs.forEach(el=>el.disabled=locked);
    resetBtn.disabled=locked;
  });

  root.querySelectorAll("[data-k]").forEach(el=>{
    const ref=base.child("header/"+el.dataset.k);
    el.onchange=()=>ref.set(el.type==="checkbox"?el.checked:el.value);
    ref.on("value",s=>{
      if(el.type==="checkbox") el.checked=!!s.val();
      else el.value=s.val()||"";
    });
  });

  root.querySelectorAll("[data-r]").forEach(el=>{
    const ref=base.child("roles/"+el.dataset.r+"/"+el.dataset.f);
    el.onchange=()=>ref.set(el.type==="checkbox"?el.checked:el.value);
    ref.on("value",s=>{
      if(el.type==="checkbox") el.checked=!!s.val();
      else el.value=s.val()||"";
    });
  });

  resetBtn.onclick=()=>{
    if(resetBtn.disabled) return;
    if(!confirm("確定要清除？")) return;
    base.set({});
  };
}
</script>

</body>
</html>
