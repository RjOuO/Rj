<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.6.89-test</title>

<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f5f5f5;padding:30px}
body::before{content:"TEST MODE";position:fixed;top:10px;right:10px;background:#c00;color:#fff;padding:6px 12px;font-weight:bold;z-index:9999;border-radius:6px}

.container{display:flex;align-items:flex-start}
.scale-wrapper{transform:scale(0.7);transform-origin:top left}
.grid{display:flex;flex-direction:column;gap:32px}
.floating-nav{position:sticky;top:50%;transform:translateY(-50%);margin-left:-250px;display:flex;flex-direction:column;gap:14px;z-index:50}
.nav-item{position:relative;width:62px;height:62px}
.nav-lock{position:absolute;left:-24px;top:50%;transform:translateY(-50%);font-size:22px;display:none;pointer-events:none}
.floating-nav button{width:62px;height:62px;border-radius:50%;border:none;background:#555;color:#fff;font-size:25px;font-weight:bold;cursor:pointer}
.floating-nav button:hover{background:#000}
.floating-nav button.nav-open{background:#1e8f4a}
.floating-nav button.nav-full{background:#f6c1c1;color:#000}
.floating-nav button.nav-done{background:#000}
.floating-nav button.nav-top{background:#bdbdbd;color:#000}
.nav-missing{position:absolute;right:-58px;top:50%;transform:translateY(-50%);font-weight:bold;font-size:20px;white-space:nowrap}
.nav-missing.normal{color:#000}
.nav-missing.alert{color:#d40000;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.reset-missing{margin-left:25px;font-weight:bold;font-size:35px;white-space:nowrap}
.reset-missing.normal{color:#000}
.reset-missing.alert{color:#d40000;animation:blink 1s infinite}
table{border-collapse:collapse;background:#fff;table-layout:fixed}
td,th{border:2px solid #000;padding:10px;text-align:center;font-size:22px}
table tr td:nth-child(3),table tr th:nth-child(3){width:200px}
table tr td:nth-child(3) input{max-width:180px}
input,select{border:none;background:transparent;font-size:22px;text-align:center}
input[type="checkbox"]{transform:scale(1.4)}
.reset-btn{padding:10px 24px;border-radius:999px;border:none;background:#444;color:#fff;cursor:pointer;font-size:22px}
.reset-btn:disabled{opacity:.4;cursor:not-allowed}
.lock-btn{padding:10px 24px;border-radius:999px;border:none;background:#000;color:#fff;cursor:pointer;font-size:22px}
.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:8px 24px}
.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}
.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#f6c1c1}
.status-done{background:#000;color:#fff}
.role-full td{background:#f6c1c1}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}
.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}

.trial-locked td,
.trial-locked td input,
.trial-locked td select{
  background:#000!important;
  color:#000!important;
  -webkit-text-fill-color:#000!important;
}


/* === TEST v1.6.89-test : online user count === */
.online-count{
  margin-top:10px;
  padding:6px 10px;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:14px;
  text-align:center;
  font-weight:bold;
}

</style>


  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="emailBtn">綁定 / 登入 Email</button>
  <button id="googleBtn">綁定 / 使用 Google 登入</button>
</div>


<style>
/* hide legacy top auth UI */
input[placeholder="Email"],
input[placeholder="Password"],
button:contains("綁定 / 登入 Email"),
button:contains("綁定 / 使用 Google 登入"){display:none!important}
</style>


<style>
/* FORCE HIDE legacy top auth bar */
body > div:first-of-type input[placeholder="Email"],
body > div:first-of-type input[placeholder="Password"],
body > div:first-of-type button{
  display:none !important;
}
</style>





<script>
/* === v1.6.89-test : reliably show game profile setup after register/login === */
(function(){
  function showGameProfileSetup(){
    const box = document.getElementById('game-profile-setup');
    if(box) box.style.display = 'block';
    document.querySelectorAll('[id*="email"], .user-email').forEach(el=>{
      el.style.display = 'none';
    });
  }

  function hasProfile(){
    return !!(localStorage.getItem('gameId') && localStorage.getItem('gameRole'));
  }

  if (typeof firebase !== 'undefined' && firebase.auth) {
    firebase.auth().onAuthStateChanged(function(user){
      if(user && !hasProfile()){
        showGameProfileSetup();
      }
    });
  } else {
    showGameProfileSetup();
  }

  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'saveGameProfileBtn'){
      const gid = document.getElementById('gameIdInput')?.value || '';
      const role = document.getElementById('gameRoleSelect')?.value || '';
      if(!gid || !role){
        alert('請填寫暱稱並選擇定位');
        return;
      }
      localStorage.setItem('gameId', gid);
      localStorage.setItem('gameRole', role);
      alert('已儲存：' + gid + '（' + role + '）');
      document.getElementById('game-profile-setup').style.display = 'none';
    }
  });
})();
</script>

</body>
</html>
