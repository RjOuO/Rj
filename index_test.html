<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.4.15-test</title>

<style>
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  padding:30px
}
body::before{
  content:"TEST MODE";
  position:fixed;
  top:10px;
  right:10px;
  background:#c00;
  color:#fff;
  padding:6px 12px;
  font-weight:bold;
  z-index:9999;
  border-radius:6px
}

/* 縮放 */
.scale-wrapper{transform:scale(0.7);transform-origin:top left}

/* 直排 */
.grid{display:flex;flex-direction:column;gap:32px}

/* ===== 懸浮按鈕 ===== */
.floating-nav{
  position:fixed;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:14px;
  z-index:9999
}
.floating-nav button{
  width:62px;
  height:62px;
  border-radius:50%;
  border:none;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  cursor:pointer;
  transition:background .15s
}
.floating-nav button:hover{filter:brightness(.9)}

/* 狀態色（團用） */
.nav-open{background:#1e8f4a}
.nav-full{background:#f6c1c1;color:#000}
.nav-done{background:#000}

/* ↑ 固定色 */
.nav-top{
  background:#bdbdbd;
  color:#000
}

/* 表格 */
table{border-collapse:collapse;background:#fff;table-layout:fixed}
td,th{border:2px solid #000;padding:10px;text-align:center;font-size:22px}
table tr td:nth-child(3),table tr th:nth-child(3){width:200px}
table tr td:nth-child(3) input{max-width:180px}

input,select{border:none;background:transparent;font-size:22px;text-align:center}
input[type="checkbox"]{transform:scale(1.4)}

.reset-btn{
  padding:10px 24px;border-radius:999px;border:none;
  background:#444;color:#fff;cursor:pointer;font-size:22px
}
.reset-btn:disabled{opacity:.4;cursor:not-allowed}

.lock-btn{
  padding:10px 24px;border-radius:999px;border:none;
  background:#000;color:#fff;cursor:pointer;font-size:22px
}

.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:8px 24px}

/* 副本 */
.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}

/* 狀態 */
.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#f6c1c1}
.status-done{background:#000;color:#fff}

/* 角色 */
.role-full td{background:#f6c1c1}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}

.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}
</style>
</head>

<body>

<div class="floating-nav" id="floatingNav"></div>

<div class="scale-wrapper">
  <div class="grid" id="grid"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoU4Jd1lzrncVc9MV2Y0tHpcJDSW96lgE",
  authDomain:"rjgame-test.firebaseapp.com",
  databaseURL:"https://rjgame-test-default-rtdb.firebaseio.com",
  projectId:"rjgame-test"
});
const db=firebase.database();
</script>

<script>
const weekdays=["日","一","二","三","四","五","六"];
const groupNames=["第一團","第二團","第三團","第四團","第五團","第六團","第七團","第八團","第九團"];
const grid=document.getElementById("grid");

/* ===== 懸浮導覽 ===== */
function scrollToGroup(n){
  document.getElementById("group-"+n)?.scrollIntoView({behavior:"smooth"});
}
function scrollToTop(){
  window.scrollTo({top:0,behavior:"smooth"});
}

const floatingNav=document.getElementById("floatingNav");

/* 1~9 團 */
for(let i=1;i<=9;i++){
  const btn=document.createElement("button");
  btn.textContent=i;
  btn.classList.add("nav-open");
  btn.onclick=()=>scrollToGroup(i);
  floatingNav.appendChild(btn);

  db.ref("test/groups/"+i+"/header/status").on("value",s=>{
    const v=s.val()||"open";
    btn.classList.remove("nav-open","nav-full","nav-done");
    if(v==="full"){
      btn.classList.add("nav-full");
    }else if(v==="done"){
      btn.classList.add("nav-done");
    }else{
      btn.classList.add("nav-open");
    }
  });
}

/* ↑ 回到最上（固定淺灰） */
const topBtn=document.createElement("button");
topBtn.textContent="↑";
topBtn.classList.add("nav-top");
topBtn.onclick=scrollToTop;
floatingNav.appendChild(topBtn);

/* ===== 時間選項 ===== */
function generateTimeOptions(){
  let html='<option></option>';
  for(let h=0;h<24;h++){
    const hh=String(h).padStart(2,"0");
    html+=`<option>${hh}:00</option><option>${hh}:30</option>`;
  }
  return html;
}

/* ===== 建立 9 團 ===== */
for(let t=1;t<=9;t++){
  const wrap=document.createElement("div");
  wrap.id="group-"+t;
  wrap.innerHTML=`
  <table>
    <tr><td colspan="4">
      <button class="lock-btn">🔓 解鎖中</button>
      &nbsp;&nbsp;
      <button class="reset-btn">一鍵清除（${groupNames[t-1]}）</button>
    </td></tr>

    <tr>
      <td class="title">報團時間</td>
      <td><input type="date" class="date-input"></td>
      <td class="gray-cell weekday-cell"></td>
      <td><select class="dropdown time-select">${generateTimeOptions()}</select></td>
    </tr>

    <tr>
      <td class="header">選擇副本</td>
      <td class="header">等級</td>
      <td class="header">隊長ID</td>
      <td class="header">狀態</td>
    </tr>

    <tr>
      <td>
        <select class="dropdown instance-select">
          <option value=""></option>
          <option value="normal">一般10人俠境</option>
          <option value="trial">試劍</option>
          <option value="guild">百業10人俠境</option>
          <option value="mix">百業+一般俠境</option>
        </select>
      </td>
      <td>
        <select class="dropdown level-select">
          <option></option><option>56</option><option>61</option><option>66</option><option>71</option>
        </select>
      </td>
      <td><input class="leader-input"></td>
      <td>
        <select class="dropdown status-select">
          <option value="open">未滿</option>
          <option value="full">滿團</option>
          <option value="done">完成</option>
        </select>
      </td>
    </tr>

    <tr>
      <td class="header">角色ID</td>
      <td class="header">定位</td>
      <td class="header">DC語音</td>
      <td class="header">備註</td>
    </tr>

    ${Array.from({length:10}).map(()=>`
    <tr class="role-row">
      <td><input></td>
      <td>
        <select class="dropdown role-select">
          <option></option><option>坦</option><option>全奶</option>
          <option>輸出</option><option>奶坦</option><option>輸出奶</option>
        </select>
      </td>
      <td><input type="checkbox"></td>
      <td><input></td>
    </tr>`).join("")}
  </table>`;
  grid.appendChild(wrap);
}
</script>

</body>
</html>
