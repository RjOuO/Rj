<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.4.11-test</title>

<style>
body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f5f5f5;
  padding:30px
}
body::before{
  content:"TEST MODE";
  position:fixed;
  top:10px;
  right:10px;
  background:#c00;
  color:#fff;
  padding:6px 12px;
  font-weight:bold;
  z-index:9999;
  border-radius:6px
}
.scale-wrapper{
  transform:scale(0.7);
  transform-origin:top left;
}
.grid{
  display:flex;
  flex-direction:column;
  gap:32px;
}
.floating-nav{
  position:fixed;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:9999;
}
.floating-nav button{
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:#555;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
.back-top{
  position:fixed;
  right:24px;
  bottom:24px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#000;
  color:#fff;
  border:none;
  font-size:22px;
  cursor:pointer;
  z-index:9999;
}
table{
  border-collapse:collapse;
  background:#fff;
  table-layout:fixed;
}
td,th{
  border:2px solid #000;
  padding:10px;
  text-align:center;
  font-size:22px;
}
table tr td:nth-child(3),
table tr th:nth-child(3){
  width:200px;
}
input,select{
  border:none;
  background:transparent;
  font-size:22px;
  text-align:center;
}
input[type="checkbox"]{transform:scale(1.4)}
.reset-btn{
  padding:10px 24px;
  border-radius:999px;
  border:none;
  background:#444;
  color:#fff;
  cursor:pointer;
  font-size:22px;
}
.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:8px 24px}
.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}
.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#f6c1c1}
.status-done{background:#000;color:#fff}
.role-full td{background:#f6c1c1}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}
.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}
</style>
</head>

<body>

<div class="floating-nav" id="floatingNav"></div>

<div class="scale-wrapper">
  <div class="grid" id="grid"></div>
</div>

<button class="back-top" onclick="scrollToGroup(1)">↑</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBoU4Jd1lzrncVc9MV2Y0tHpcJDSW96lgE",
  authDomain:"rjgame-test.firebaseapp.com",
  databaseURL:"https://rjgame-test-default-rtdb.firebaseio.com",
  projectId:"rjgame-test"
});
const db=firebase.database();
const baseRef=db.ref("test/groups");
</script>

<script>
const weekdays=["日","一","二","三","四","五","六"];
const groupNames=["第一團","第二團","第三團","第四團","第五團","第六團","第七團","第八團","第九團"];
const grid=document.getElementById("grid");

function scrollToGroup(n){
  document.getElementById("group-"+n)?.scrollIntoView({behavior:"smooth"});
}

const floatingNav=document.getElementById("floatingNav");
for(let i=1;i<=9;i++){
  const b=document.createElement("button");
  b.textContent=i;
  b.onclick=()=>scrollToGroup(i);
  floatingNav.appendChild(b);
}

function generateTimeOptions(){
  let h='<option></option>';
  for(let i=0;i<24;i++){
    const hh=String(i).padStart(2,"0");
    h+=`<option>${hh}:00</option><option>${hh}:30</option>`;
  }
  return h;
}

/* 建立 9 團 */
for(let t=1;t<=9;t++){
  const wrap=document.createElement("div");
  wrap.id="group-"+t;
  wrap.innerHTML=`
  <table>
    <tr><td colspan="4"><button class="reset-btn">一鍵清除（${groupNames[t-1]}）</button></td></tr>
    <tr>
      <td class="title">報團時間</td>
      <td><input type="date" class="date-input"></td>
      <td class="gray-cell weekday-cell"></td>
      <td><select class="dropdown time-select">${generateTimeOptions()}</select></td>
    </tr>
    <tr>
      <td class="header">選擇副本</td>
      <td class="header">等級</td>
      <td class="header">隊長ID</td>
      <td class="header">狀態</td>
    </tr>
    <tr>
      <td><select class="dropdown instance-select">
        <option value=""></option>
        <option value="normal">一般10人俠境</option>
        <option value="trial">試劍</option>
        <option value="guild">百業10人俠境</option>
        <option value="mix">百業+一般俠境</option>
      </select></td>
      <td><select class="dropdown level-select">
        <option></option><option>56</option><option>61</option><option>66</option><option>71</option>
      </select></td>
      <td><input class="leader-input"></td>
      <td><select class="dropdown status-select">
        <option value="open">未滿</option>
        <option value="full">滿團</option>
        <option value="done">完成</option>
      </select></td>
    </tr>
    <tr>
      <td class="header">角色ID</td>
      <td class="header">定位</td>
      <td class="header">DC語音</td>
      <td class="header">備註</td>
    </tr>
    ${Array.from({length:10}).map(()=>`
    <tr class="role-row">
      <td><input class="rid"></td>
      <td><select class="dropdown role-select">
        <option></option><option>坦</option><option>全奶</option>
        <option>輸出</option><option>奶坦</option><option>輸出奶</option>
      </select></td>
      <td><input type="checkbox" class="dc"></td>
      <td><input class="note"></td>
    </tr>`).join("")}
  </table>`;
  grid.appendChild(wrap);
  initTable(wrap,t);
}

/* 初始化 + Firebase 同步 */
function initTable(root,idx){
  const ref=baseRef.child(idx);
  const date=root.querySelector(".date-input");
  const weekday=root.querySelector(".weekday-cell");
  const time=root.querySelector(".time-select");
  const instance=root.querySelector(".instance-select");
  const level=root.querySelector(".level-select");
  const leader=root.querySelector(".leader-input");
  const status=root.querySelector(".status-select");
  const reset=root.querySelector(".reset-btn");
  const rows=[...root.querySelectorAll(".role-row")];

  function updateWeekday(){
    if(!date.value){weekday.textContent="";return;}
    weekday.textContent="星期"+weekdays[new Date(date.value).getDay()];
  }

  function applyRules(){
    instance.className="dropdown instance-"+(instance.value||"empty");
    status.className="dropdown status-"+status.value;
    rows.forEach((r,i)=>{
      r.classList.remove("trial-locked","role-full","role-done");
      r.querySelectorAll("input,select").forEach(el=>el.disabled=false);
      if(instance.value==="trial" && i>=5){
        r.classList.add("trial-locked");
        r.querySelectorAll("input,select").forEach(el=>{
          el.type==="checkbox"?el.checked=false:el.value="";
          el.disabled=true;
        });
      }
      if(status.value!=="open"){
        r.classList.add(status.value==="full"?"role-full":"role-done");
        r.querySelectorAll("td:nth-child(-n+3) input,select").forEach(el=>el.disabled=true);
      }
      const sel=r.querySelector(".role-select");
      sel.parentElement.className={
        "坦":"role-cell-tank","全奶":"role-cell-heal",
        "輸出":"role-cell-dps","奶坦":"role-cell-ht",
        "輸出奶":"role-cell-dh"
      }[sel.value]||"role-cell-empty";
    });
  }

  function write(){
    ref.set({
      time:{date:date.value,slot:time.value},
      team:{instance:instance.value,level:level.value,leader:leader.value,status:status.value},
      roles:rows.map(r=>({
        id:r.querySelector(".rid").value,
        role:r.querySelector(".role-select").value,
        dc:r.querySelector(".dc").checked,
        note:r.querySelector(".note").value
      }))
    });
  }

  ref.on("value",s=>{
    const d=s.val(); if(!d) return;
    date.value=d.time?.date||"";
    time.value=d.time?.slot||"";
    instance.value=d.team?.instance||"";
    level.value=d.team?.level||"";
    leader.value=d.team?.leader||"";
    status.value=d.team?.status||"open";
    rows.forEach((r,i)=>{
      const rd=d.roles?.[i]||{};
      r.querySelector(".rid").value=rd.id||"";
      r.querySelector(".role-select").value=rd.role||"";
      r.querySelector(".dc").checked=!!rd.dc;
      r.querySelector(".note").value=rd.note||"";
    });
    updateWeekday();
    applyRules();
  });

  root.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("change",()=>{updateWeekday();applyRules();write();});
  });

  reset.onclick=()=>{
    if(!confirm("確定要清除目前團隊內容嗎？"))return;
    ref.remove();
  };
}
</script>

</body>
</html>
