<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>下拉標籤選單</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f6f6f6;
    padding: 40px;
  }

  table {
    border-collapse: collapse;
    background: #fff;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
    min-width: 140px;
  }

  th {
    background: #ffe9a8;
  }

  /* 下拉選單本體 */
  select {
    width: 140px;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #ccc;
    font-size: 14px;
    cursor: pointer;
    appearance: none;
    background-repeat: no-repeat;
    background-position: right 10px center;
  }

  /* 各選項顏色 */
  option[value="green"] {
    background: #2ecc71;
    color: #fff;
  }

  option[value="blue"] {
    background: #3498db;
    color: #fff;
  }

  option[value="brown"] {
    background: #8e5a2b;
    color: #fff;
  }

  option[value="red"] {
    background: #e74c3c;
    color: #fff;
  }

  /* 選中後的顏色（JS 會套） */
  .green { background: #2ecc71; color: #fff; }
  .blue  { background: #3498db; color: #fff; }
  .brown { background: #8e5a2b; color: #fff; }
  .red   { background: #e74c3c; color: #fff; }
</style>
</head>
<body>

<table>
  <tr>
    <th>選擇副本</th>
    <th>等級</th>
