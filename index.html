<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表</title>

<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f5f5f5;padding:30px}
table{border-collapse:collapse;background:#fff}
td,th{border:2px solid #000;padding:6px;text-align:center;font-size:18px}
.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:4px 20px;border:none}
select{text-align-last:center}
.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}
.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#7a1f1f;color:#fff}
.status-done{background:#000;color:#fff}
.role-full td{background:#7a1f1f;color:#fff}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}
input{border:none;background:transparent}
input[type="checkbox"]{transform:scale(1.2)}
.reset-btn{padding:8px 20px;border-radius:999px;border:none;background:#444;color:#fff;cursor:pointer}
.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}
</style>
</head>

<body>

<table>
<tr><td colspan="4"><button class="reset-btn" onclick="confirmReset()">一鍵清除</button></td></tr>

<tr>
  <td class="title">報團時間</td>
  <td><input type="date" id="groupDate"></td>
  <td class="gray-cell" id="weekdayCell"></td>
  <td><input type="time" id="groupTime"></td>
</tr>

<tr>
  <td class="header">選擇副本</td>
  <td class="header">等級</td>
  <td class="header">隊長ID</td>
  <td class="header">狀態</td>
</tr>

<tr>
  <td>
    <select id="instanceSelect" class="dropdown instance-empty">
      <option value=""></option>
      <option value="normal">一般10人俠境</option>
      <option value="trial">試劍</option>
      <option value="guild">百業10人俠境</option>
      <option value="mix">百業+一般俠境</option>
    </select>
  </td>
  <td>
    <select id="levelSelect" class="dropdown">
      <option></option><option>56</option><option>61</option><option>66</option><option>71</option>
    </select>
  </td>
  <td><input id="leaderId"></td>
  <td>
    <select id="statusSelect" class="dropdown status-open">
      <option value="open" selected>未滿</option>
      <option value="full">滿團</option>
      <option value="done">完成</option>
    </select>
  </td>
</tr>

<tr>
  <td class="header">角色ID</td>
  <td class="header">定位</td>
  <td class="header">DC語音</td>
  <td class="header">備註</td>
</tr>

<script>
for(let i=0;i<10;i++){
document.write(`
<tr class="role-row">
  <td><input></td>
  <td>
    <select class="dropdown">
      <option></option>
      <option>坦</option>
      <option>全奶</option>
      <option>輸出</option>
      <option>奶坦</option>
      <option>輸出奶</option>
    </select>
  </td>
  <td><input type="checkbox"></td>
  <td><input></td>
</tr>
`);
}
</script>
</table>

<script>
/* ===== 全域 ===== */
window.isSyncApplying=false;
let countdownTimer=null;
let countdownInterval=null;
let countdownSec=0;

const groupDate=document.getElementById("groupDate");
const weekdayCell=document.getElementById("weekdayCell");
const instanceSelect=document.getElementById("instanceSelect");
const statusSelect=document.getElementById("statusSelect");
const roleRows=document.querySelectorAll(".role-row");
const weekdays=["日","一","二","三","四","五","六"];

/* ===== 星期 ===== */
function updateWeekday(){
  if(!groupDate.value){weekdayCell.textContent="";return;}
  const d=new Date(groupDate.value);
  weekdayCell.textContent="星期"+weekdays[d.getDay()];
}

/* ===== 滿團判斷 ===== */
function isAllRoleFilled(){
  return [...roleRows].every(row=>{
    const id=row.querySelector("td:nth-child(1) input").value.trim();
    const role=row.querySelector("td:nth-child(2) select").value;
    return id!=="" && role!=="";
  });
}

/* ===== 倒數控制 ===== */
function startCountdown(){
  if(countdownInterval || statusSelect.value!=="open") return;

  countdownSec=59;
  statusSelect.options[0].text=`未滿（${countdownSec}）`;

  countdownInterval=setInterval(()=>{
    countdownSec--;
    if(countdownSec>=0){
      statusSelect.options[0].text=`未滿（${countdownSec}）`;
    }
  },1000);

  countdownTimer=setTimeout(()=>{
    stopCountdown();
    window.isSyncApplying=true;
    statusSelect.value="full";
    applyRules();
    pushToCloud();
    window.isSyncApplying=false;
  },60000);
}

function stopCountdown(){
  clearInterval(countdownInterval);
  clearTimeout(countdownTimer);
  countdownInterval=null;
  countdownTimer=null;
  countdownSec=0;
  statusSelect.options[0].text="未滿";
}

/* ===== 規則引擎（原樣） ===== */
function applyRules(){
  instanceSelect.className="dropdown instance-"+(instanceSelect.value||"empty");

  roleRows.forEach((row,i)=>{
    row.classList.remove("trial-locked");
    row.querySelectorAll("input,select").forEach(el=>el.disabled=false);

    if(instanceSelect.value==="trial"&&i>=5){
      row.classList.add("trial-locked");
      row.querySelectorAll("input,select").forEach(el=>{
        el.type==="checkbox"?el.checked=false:el.value="";
        el.disabled=true;
      });
    }
  });

  statusSelect.className="dropdown status-"+(statusSelect.value||"open");
  const locked=statusSelect.value==="full"||statusSelect.value==="done";

  roleRows.forEach(row=>{
    row.classList.remove("role-full","role-done");
    if(statusSelect.value==="full")row.classList.add("role-full");
    if(statusSelect.value==="done")row.classList.add("role-done");

    if(locked){
      row.querySelectorAll("input,select").forEach(el=>el.disabled=true);
    }
  });

  roleRows.forEach(row=>{
    const sel=row.querySelector("select");
    const td=sel.parentElement;
    td.className="";
    const map={
      "坦":"role-cell-tank",
      "全奶":"role-cell-heal",
      "輸出":"role-cell-dps",
      "奶坦":"role-cell-ht",
      "輸出奶":"role-cell-dh"
    };
    td.classList.add(map[sel.value]||"role-cell-empty");
  });
}

/* ===== 事件 ===== */
groupDate.addEventListener("change",updateWeekday);
instanceSelect.addEventListener("change",()=>{if(window.isSyncApplying)return;applyRules();});
statusSelect.addEventListener("change",()=>{
  if(window.isSyncApplying)return;
  stopCountdown();
  applyRules();
});

document.addEventListener("input",()=>{
  if(window.isSyncApplying)return;
  isAllRoleFilled()?startCountdown():stopCountdown();
  pushToCloud();
});

document.addEventListener("change",()=>{
  if(window.isSyncApplying)return;
  isAllRoleFilled()?startCountdown():stopCountdown();
  pushToCloud();
});

/* ===== 清除 ===== */
function confirmReset(){
  if(!confirm("確定要清除目前表格內容嗎？"))return;
  window.isSyncApplying=true;
  stopCountdown();
  document.querySelectorAll("input,select").forEach(el=>{
    el.type==="checkbox"?el.checked=false:el.value="";
    el.disabled=false;
  });
  statusSelect.value="open";
  updateWeekday();
  applyRules();
  pushToCloud();
  window.isSyncApplying=false;
}

applyRules();
updateWeekday();
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===== Cloud Sync ===== */
const ref=firebase.database().ref("tables/gameinn-main");
let isRemote=false;

function collect(){
  return [...document.querySelectorAll("input,select")].map(el=>el.type==="checkbox"?el.checked:el.value);
}

function pushToCloud(){
  if(isRemote)return;
  ref.set({data:collect(),updatedAt:Date.now()});
}

ref.on("value",snap=>{
  if(!snap.val())return;
  isRemote=true;
  window.isSyncApplying=true;
  stopCountdown();

  const data=snap.val().data;
  document.querySelectorAll("input,select").forEach((el,i)=>{
    if(data[i]===undefined)return;
    el.type==="checkbox"?el.checked=data[i]:el.value=data[i];
  });

  updateWeekday();
  applyRules();

  setTimeout(()=>{isRemote=false;window.isSyncApplying=false;},0);
});
</script>

</body>
</html>
