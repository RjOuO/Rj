<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表 v1.3.1</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f5f5f5;
  padding: 30px;
}

table {
  border-collapse: collapse;
  background: #fff;
}

td, th {
  border: 2px solid #333;
  padding: 6px;
  text-align: center;
}
</style>
</head>

<body>

<h2>遊戲旅舍報團專用表</h2>

<table>
  <tr>
    <th>狀態</th>
    <td>
      <select id="statusSelect">
        <option value="">請選擇</option>
        <option value="進行中">進行中</option>
        <option value="完成">完成</option>
      </select>
    </td>
  </tr>

  <tr>
    <th>玩家名稱</th>
    <td><input type="text"></td>
  </tr>

  <tr>
    <th>定位</th>
    <td>
      <select>
        <option value="">請選擇</option>
        <option value="坦">坦</option>
        <option value="輸出">輸出</option>
        <option value="補">補</option>
      </select>
    </td>
  </tr>

  <tr>
    <th>備註</th>
    <td><input type="text"></td>
  </tr>
</table>

<br>

<button onclick="clearAllData()">一鍵清除</button>

<script>
/* ===== v1.3.1 原始一鍵清除功能 ===== */

function clearAllData() {
  document.querySelectorAll("input, select, textarea").forEach(el => {
    if (el.tagName === "SELECT") {
      el.selectedIndex = 0;
    } else {
      el.value = "";
    }
  });
}
</script>

</body>
</html>
