<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表（九團版） v1.4.43</title>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#f5f5f5;padding:30px}
.container{display:flex;align-items:flex-start}
.scale-wrapper{transform:scale(0.7);transform-origin:top left}
.grid{display:flex;flex-direction:column;gap:32px}
.floating-nav{position:sticky;top:50%;transform:translateY(-50%);margin-left:-250px;display:flex;flex-direction:column;gap:14px;z-index:50}
.nav-item{position:relative;width:62px;height:62px}
.nav-lock{position:absolute;left:-24px;top:50%;transform:translateY(-50%);font-size:22px;display:none;pointer-events:none}
.floating-nav button{width:62px;height:62px;border-radius:50%;border:none;background:#555;color:#fff;font-size:25px;font-weight:bold;cursor:pointer}
.floating-nav button:hover{background:#000}
.floating-nav button.nav-open{background:#1e8f4a}
.floating-nav button.nav-full{background:#f6c1c1;color:#000}
.floating-nav button.nav-done{background:#000}
.floating-nav button.nav-top{background:#bdbdbd;color:#000}
.nav-missing{position:absolute;right:-58px;top:50%;transform:translateY(-50%);font-weight:bold;font-size:20px;white-space:nowrap}
.nav-missing.normal{color:#000}
.nav-missing.alert{color:#d40000;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.reset-missing{margin-left:25px;font-weight:bold;font-size:35px;white-space:nowrap}
.reset-missing.normal{color:#000}
.reset-missing.alert{color:#d40000;animation:blink 1s infinite}
table{border-collapse:collapse;background:#fff;table-layout:fixed}
td,th{border:2px solid #000;padding:10px;text-align:center;font-size:22px}
table tr td:nth-child(3),table tr th:nth-child(3){width:200px}
table tr td:nth-child(3) input{max-width:180px}
input,select{border:none;background:transparent;font-size:22px;text-align:center}
input[type="checkbox"]{transform:scale(1.4)}
.reset-btn{padding:10px 24px;border-radius:999px;border:none;background:#444;color:#fff;cursor:pointer;font-size:22px}
.reset-btn:disabled{opacity:.4;cursor:not-allowed}
.lock-btn{padding:10px 24px;border-radius:999px;border:none;background:#000;color:#fff;cursor:pointer;font-size:22px}
.title{background:#fff200;font-weight:bold}
.header{background:#ffe8b0;font-weight:bold}
.gray-cell{background:#e0e0e0;font-weight:bold}
.dropdown{width:100%;border-radius:999px;padding:8px 24px}
.instance-empty{background:#e6e6e6}
.instance-normal{background:#c8f0c2}
.instance-trial{background:#4da3ff;color:#fff}
.instance-guild{background:#5a3a1a;color:#fff}
.instance-mix{background:#b22222;color:#fff}
.status-open{background:#1e8f4a;color:#fff}
.status-full{background:#f6c1c1}
.status-done{background:#000;color:#fff}
.role-full td{background:#f6c1c1}
.role-done td{background:#4a4a4a;color:#fff}
.trial-locked td{background:#000!important;color:#fff!important}
.role-cell-tank{background:#f6c1c1}
.role-cell-heal{background:#cdeecb}
.role-cell-dps{background:#cfe8ff}
.role-cell-ht{background:#e3d4f3}
.role-cell-dh{background:#e6e6e6}
.role-cell-empty{background:#fff}
.countdown-slot{
  position:absolute;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  width:260px;
  text-align:right;
  font-size:35px;
  font-weight:bold;
  white-space:nowrap;
  pointer-events:none;
}
.countdown-slot.alert{color:#d40000;animation:blink 1s infinite}
</style>
</head>
<body>
<div class="container">
  <div class="scale-wrapper"><div class="grid" id="grid"></div></div>
  <div class="floating-nav" id="floatingNav"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAhGIn-RLMZVNFhLgQbHUpSzYn5M4M4gEQ",
  authDomain:"rjgame-582d0.firebaseapp.com",
  databaseURL:"https://rjgame-582d0-default-rtdb.firebaseio.com",
  projectId:"rjgame-582d0"
});
const db=firebase.database();
</script>

<script>
const weekdays=["日","一","二","三","四","五","六"];
const groupNames=["第一團","第二團","第三團","第四團","第五團","第六團","第七團","第八團","第九團"];
const grid=document.getElementById("grid");
const floatingNav=document.getElementById("floatingNav");

function scrollToGroup(n){document.getElementById("group-"+n)?.scrollIntoView({behavior:"smooth"})}
function scrollToTop(){window.scrollTo({top:0,behavior:"smooth"})}

for(let i=1;i<=9;i++){
  const item=document.createElement("div"); item.className="nav-item";
  const lock=document.createElement("span"); lock.className="nav-lock"; lock.textContent="🔒";
  const btn=document.createElement("button"); btn.textContent=i; btn.onclick=()=>scrollToGroup(i);
  const miss=document.createElement("span"); miss.className="nav-missing"; miss.id="nav-missing-"+i;
  item.appendChild(lock); item.appendChild(btn); item.appendChild(miss); floatingNav.appendChild(item);
  db.ref("groups/"+i+"/header/status").on("value",s=>{
    const v=s.val()||"open"; btn.className="";
    btn.classList.add(v==="full"?"nav-full":v==="done"?"nav-done":"nav-open");
  });
  db.ref("groups/"+i+"/meta/locked").on("value",s=>{lock.style.display=s.val()?"block":"none"});
}
const topItem=document.createElement("div"); topItem.className="nav-item";
const topBtn=document.createElement("button"); topBtn.textContent="↑"; topBtn.classList.add("nav-top");
topBtn.onclick=scrollToTop; topItem.appendChild(topBtn); floatingNav.appendChild(topItem);

function generateTimeOptions(){let html='<option></option>';for(let h=0;h<24;h++){const hh=String(h).padStart(2,"0");html+=`<option>${hh}:00</option><option>${hh}:30</option>`}return html}

for(let t=1;t<=9;t++){
  const wrap=document.createElement("div"); wrap.id="group-"+t;
  wrap.innerHTML=`<table>
    <tr><td colspan="4">
      <button class="lock-btn">🔓 解鎖中</button>
      <button class="reset-btn">一鍵清除（${groupNames[t-1]}）</button>
      <span class="reset-missing" id="reset-missing-${t}"></span>
      <span class="countdown-slot" id="countdown-${t}"></span>
    </td></tr>
    <tr><td class="title">報團時間</td><td><input type="date" class="date-input"></td><td class="gray-cell weekday-cell"></td><td><select class="dropdown time-select">${generateTimeOptions()}</select></td></tr>
    <tr><td class="header">選擇副本</td><td class="header">等級</td><td class="header">隊長ID</td><td class="header">狀態</td></tr>
    <tr>
      <td><select class="dropdown instance-select">
        <option value=""></option>
        <option value="normal">一般10人俠境</option>
        <option value="trial">試劍</option>
        <option value="guild">百業10人俠境</option>
        <option value="mix">百業+一般俠境</option>
      </select></td>
      <td><select class="dropdown level-select"><option></option><option>56</option><option>61</option><option>66</option><option>71</option></select></td>
      <td><input class="leader-input"></td>
      <td><select class="dropdown status-select"><option value="open">未滿</option><option value="full">滿團</option><option value="done">完成</option></select></td>
    </tr>
    <tr><td class="header">角色ID</td><td class="header">定位</td><td class="header">DC語音</td><td class="header">備註</td></tr>
    ${Array.from({length:10}).map(()=>`
      <tr class="role-row">
        <td><input></td>
        <td><select class="dropdown role-select"><option></option><option>坦</option><option>全奶</option><option>輸出</option><option>奶坦</option><option>輸出奶</option></select></td>
        <td><input type="checkbox"></td>
        <td><input></td>
      </tr>`).join("")}
  </table>`;
  grid.appendChild(wrap);
  initTable(wrap,t);
}

function initTable(root,idx){
  const base=db.ref("groups/"+idx);
  const lockRef=base.child("meta/locked");
  const statusRef=base.child("header/status");
  const dateInput=root.querySelector(".date-input");
  const weekdayCell=root.querySelector(".weekday-cell");
  const timeSelect=root.querySelector(".time-select");
  const instance=root.querySelector(".instance-select");
  const level=root.querySelector(".level-select");
  const leader=root.querySelector(".leader-input");
  const status=root.querySelector(".status-select");
  const resetBtn=root.querySelector(".reset-btn");
  const lockBtn=root.querySelector(".lock-btn");
  const rows=[...root.querySelectorAll(".role-row")];

  root.dataset.max="10";

  function updateWeekday(){
    if(!dateInput.value){weekdayCell.textContent="";return;}
    const d=new Date(dateInput.value); weekdayCell.textContent="星期"+weekdays[d.getDay()];
  }

  function applyRules(){
    instance.className="dropdown instance-"+(instance.value||"empty");
    status.className="dropdown status-"+status.value;
    const MAX=(instance.value==="trial")?5:10; root.dataset.max=String(MAX);
    const isLocked=root.dataset.locked==="1";
    rows.forEach((r,i)=>{
      r.classList.remove("trial-locked","role-full","role-done");
      if(!isLocked){r.querySelectorAll("input,select").forEach(el=>el.disabled=false);}
      if(instance.value==="trial"&&i>=5){r.classList.add("trial-locked"); r.querySelectorAll("input,select").forEach(el=>el.disabled=true);}
      if(status.value!=="open"){
        r.classList.add(status.value==="full"?"role-full":"role-done");
        r.querySelectorAll("td:nth-child(-n+3) input,select").forEach(el=>el.disabled=true);
      }
      const sel=r.querySelector(".role-select");
      sel.parentElement.className={"坦":"role-cell-tank","全奶":"role-cell-heal","輸出":"role-cell-dps","奶坦":"role-cell-ht","輸出奶":"role-cell-dh"}[sel.value]||"role-cell-empty";
    });
    window.__recalcMissing && window.__recalcMissing();
  }

  [[dateInput,"date"],[timeSelect,"time"],[instance,"instance"],[level,"level"],[leader,"leader"]].forEach(([el,k])=>{
    const ref=base.child("header/"+k);
    el.onchange=()=>ref.set(el.value);
    ref.on("value",s=>{el.value=s.val()||"";updateWeekday();applyRules()});
  });

  statusRef.once("value").then(s=>{if(s.val()===null) statusRef.set("open")});
  status.onchange=()=>statusRef.set(status.value);
  statusRef.on("value",s=>{status.value=s.val()||"open";updateWeekday();applyRules()});

  rows.forEach((r,i)=>{
    r.querySelectorAll("input,select").forEach(el=>{
      const key=el.type==="checkbox"?"dc":el.classList.contains("role-select")?"role":el===r.children[0].querySelector("input")?"name":"note";
      const ref=base.child("roles/"+i+"/"+key);
      el.onchange=()=>ref.set(el.type==="checkbox"?el.checked:el.value);
      ref.on("value",s=>{el.type==="checkbox"?el.checked=!!s.val():el.value=s.val()||"";applyRules()});
    });
  });

  lockBtn.onclick=()=>{const wantLock=lockBtn.textContent.includes("解鎖"); lockRef.set(wantLock)};
  lockRef.on("value",s=>{
    const locked=!!s.val();
    root.dataset.locked=locked?"1":"0";
    lockBtn.textContent=locked?"🔒 已鎖定":"🔓 解鎖中";
    root.querySelectorAll("input,select").forEach(el=>{el.disabled=locked});
    resetBtn.disabled=locked;
  });

  resetBtn.onclick=()=>{if(resetBtn.disabled) return; if(!confirm("確定要清除目前團隊內容嗎？")) return; base.set({})};
  updateWeekday(); applyRules();
}

window.addEventListener("load",()=>{
  function recalc(){
    for(let i=1;i<=9;i++){
      const g=document.getElementById("group-"+i); if(!g) continue;
      const MAX=parseInt(g.dataset.max||"10",10);
      const nav=document.getElementById("nav-missing-"+i);
      const reset=document.getElementById("reset-missing-"+i);
      let c=0;
      const inputs=g.querySelectorAll("tr.role-row td:first-child input");
      inputs.forEach((inp,idx)=>{if(idx<MAX&&inp.value.trim()!=="") c++});
      const miss=MAX-c;
      const cls=(miss<=2?"alert":"normal");
      if(nav){if(miss<=0){nav.textContent=""; nav.className="nav-missing"} else{nav.textContent="(-"+miss+")"; nav.className="nav-missing "+cls}}
      if(reset){if(miss<=0){reset.textContent=""; reset.className="reset-missing"} else{reset.textContent="目前還缺 "+miss+" 人"; reset.className="reset-missing "+cls}}
    }
  }
  window.__recalcMissing=recalc; recalc(); setInterval(recalc,800);
});
</script>

<script>
(function(){
  const COUNTDOWN_SEC=60; const state={};
  function getMax(groupEl){return parseInt(groupEl.dataset.max||"10",10)}
  function countReady(groupEl){
    const MAX=getMax(groupEl); let ready=0;
    const rows=groupEl.querySelectorAll("tr.role-row");
    rows.forEach((row,idx)=>{
      if(idx>=MAX) return;
      const id=row.querySelector("td:first-child input");
      const role=row.querySelector(".role-select");
      if(id&&role&&id.value.trim()!==""&&role.value.trim()!==""){ready++}
    });
    return ready;
  }
  function setStatusIfNeeded(ref, val){
    ref.once("value").then(s=>{ if(s.val()!==val) ref.set(val) });
  }
  function tick(groupId){
    const groupEl=document.getElementById("group-"+groupId); if(!groupEl) return;
    const MAX=getMax(groupEl); const ready=countReady(groupEl);
    const display=document.getElementById("countdown-"+groupId);
    const statusRef=firebase.database().ref("groups/"+groupId+"/header/status");
    if(ready<MAX){
      state[groupId]=null;
      if(display){display.textContent=""; display.className="countdown-slot"}
      setStatusIfNeeded(statusRef,"open");
      return;
    }
    if(!state[groupId]) state[groupId]={remain:COUNTDOWN_SEC};
    if(display){
      display.textContent="滿團倒數 "+state[groupId].remain+" 秒";
      if(state[groupId].remain<=10) display.classList.add("alert"); else display.classList.remove("alert");
    }
    state[groupId].remain--;
    if(state[groupId].remain<0){
      state[groupId]=null;
      if(display){display.textContent=""; display.className="countdown-slot"}
      setStatusIfNeeded(statusRef,"full");
    }
  }
  window.addEventListener("load",()=>{ for(let i=1;i<=9;i++){ state[i]=null; setInterval(()=>tick(i),1000)} });
})();
</script>

</body>
</html>
