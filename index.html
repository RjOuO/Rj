<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>遊戲旅舍報團專用表 v1.3.1</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f5f5f5;
  padding: 30px;
}

table {
  border-collapse: collapse;
  background: #fff;
}

td, th {
  border: 2px solid #333;
  padding: 6px;
  text-align: center;
}

#clearCountdown {
  display: none;
  margin-top: 6px;
  color: #c0392b;
  font-weight: bold;
  font-size: 14px;
}
</style>
</head>

<body>

<h2>遊戲旅舍報團專用表</h2>

<table>
  <tr>
    <th>狀態</th>
    <td>
      <select id="statusSelect">
        <option value="">請選擇</option>
        <option value="進行中">進行中</option>
        <option value="完成">完成</option>
      </select>
      <div id="clearCountdown"></div>
    </td>
  </tr>

  <tr>
    <th>玩家名稱</th>
    <td><input type="text"></td>
  </tr>

  <tr>
    <th>定位</th>
    <td>
      <select>
        <option value="">請選擇</option>
        <option value="坦">坦</option>
        <option value="輸出">輸出</option>
        <option value="補">補</option>
      </select>
    </td>
  </tr>

  <tr>
    <th>備註</th>
    <td><input type="text"></td>
  </tr>
</table>

<br>

<button onclick="clearAllData()">一鍵清除</button>

<script>
/* ===== v1.3.1：完成狀態倒數自動清除（保證觸發） ===== */

document.addEventListener("DOMContentLoaded", () => {

  let autoClearTimer = null;
  let countdownTimer = null;
  let remainingSeconds = 60;

  const statusSelect = document.getElementById("statusSelect");
  const countdownEl = document.getElementById("clearCountdown");

  function stopCountdown() {
    if (autoClearTimer) {
      clearTimeout(autoClearTimer);
      autoClearTimer = null;
    }
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
    countdownEl.style.display = "none";
  }

  function clearAllData() {
    document.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.tagName === "SELECT") {
        el.selectedIndex = 0;
      } else {
        el.value = "";
      }
    });
    stopCountdown();
  }

  function startCountdown() {
    remainingSeconds = 60;
    countdownEl.style.display = "block";
    countdownEl.textContent = `${remainingSeconds} 秒後將自動清除`;

    countdownTimer = setInterval(() => {
      remainingSeconds--;
      countdownEl.textContent = `${remainingSeconds} 秒後將自動清除`;
      if (remainingSeconds <= 0) {
        clearInterval(countdownTimer);
      }
    }, 1000);

    autoClearTimer = setTimeout(() => {
      clearAllData();
    }, 60000);
  }

  statusSelect.addEventListener("change", () => {
    stopCountdown();
    if (statusSelect.value === "完成") {
      startCountdown();
    }
  });

  // 讓外部按鈕可呼叫
  window.clearAllData = clearAllData;
});
</script>

</body>
</html>
